services:
  resale-tracker:
    image: ghcr.io/collinjdoyle/resale-tracker:latest
    container_name: resale-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: "choose-a-password"
      SESSION_SECRET: "paste-a-long-random-string"
    volumes:
      - /mnt/user/appdata/resale-tracker:/data
